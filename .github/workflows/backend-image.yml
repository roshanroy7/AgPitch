# Builds the backend container on GitHub and stores it in GitHub's registry (ghcr.io).
# Azure Container Apps then pulls the finished image from there.
name: Build backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch: # lets me run it by hand from the Actions tab

permissions:
  contents: read
  packages: write # needed to save the image to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/roshanroy7/agpitch-api:latest
            ghcr.io/roshanroy7/agpitch-api:${{ github.sha }}